<div class="cambiar">
  <div class="cambiar__card">
    <header class="cambiar__header">
      <span class="cambiar__icon"><i class="ti ti-shield-lock" aria-hidden="true"></i></span>
      <h1>{{ 'auth.cambiarPassword.title' | translate }}</h1>
      <span class="cambiar__rule" aria-hidden="true"></span>
      <p>{{ 'auth.cambiarPassword.subtitle' | translate }}</p>
    </header>

    <form class="cambiar__body" [formGroup]="cambiarPasswordForm" (ngSubmit)="onSubmit()">
      @if (errorMessage) {
        <div class="cambiar__alert" role="alert">
          <i class="ti ti-alert-circle" aria-hidden="true"></i>
          <span>{{ errorMessage }}</span>
        </div>
      }

      @if (successMessage) {
        <div class="cambiar__success" role="status">
          <i class="ti ti-circle-check" aria-hidden="true"></i>
          <span>{{ successMessage }}</span>
        </div>
      }

      <label class="cambiar__field">
        <span>{{ 'auth.cambiarPassword.nuevaPassword' | translate }} <em>*</em></span>
        <span class="cambiar__password">
          <input
            id="nueva_password"
            [type]="showPassword ? 'text' : 'password'"
            [class.is-invalid]="nuevaPassword?.invalid && (nuevaPassword?.dirty || nuevaPassword?.touched)"
            formControlName="nueva_password"
            [placeholder]="'auth.cambiarPassword.passwordPlaceholder' | translate"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="cambiar__toggle"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="'auth.cambiarPassword.showPassword' | translate"
          >
            <i class="ti" [class.ti-eye]="!showPassword" [class.ti-eye-off]="showPassword" aria-hidden="true"></i>
          </button>
        </span>
        @if (nuevaPassword?.invalid && (nuevaPassword?.dirty || nuevaPassword?.touched)) {
          <small class="cambiar__error">
            <i class="ti ti-alert-circle" aria-hidden="true"></i>
            @if (nuevaPassword?.errors?.['minlength']) {
              {{ 'auth.cambiarPassword.passwordTooShort' | translate }}
            } @else {
              {{ 'auth.cambiarPassword.required' | translate }}
            }
          </small>
        } @else {
          <small class="cambiar__hint">{{ 'auth.cambiarPassword.passwordHint' | translate }}</small>
        }
      </label>

      <label class="cambiar__field">
        <span>{{ 'auth.cambiarPassword.confirmarPassword' | translate }} <em>*</em></span>
        <span class="cambiar__password">
          <input
            id="confirmar_password"
            [type]="showPasswordConfirm ? 'text' : 'password'"
            [class.is-invalid]="(confirmarPassword?.invalid || isPasswordMismatch) && (confirmarPassword?.dirty || confirmarPassword?.touched)"
            formControlName="confirmar_password"
            [placeholder]="'auth.cambiarPassword.passwordPlaceholder' | translate"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="cambiar__toggle"
            (click)="showPasswordConfirm = !showPasswordConfirm"
            [attr.aria-label]="'auth.cambiarPassword.showPassword' | translate"
          >
            <i class="ti" [class.ti-eye]="!showPasswordConfirm" [class.ti-eye-off]="showPasswordConfirm" aria-hidden="true"></i>
          </button>
        </span>
        @if ((confirmarPassword?.invalid || isPasswordMismatch) && (confirmarPassword?.dirty || confirmarPassword?.touched)) {
          <small class="cambiar__error">
            <i class="ti ti-alert-circle" aria-hidden="true"></i>
            @if (isPasswordMismatch) {
              {{ 'auth.cambiarPassword.passwordsMismatch' | translate }}
            } @else {
              {{ 'auth.cambiarPassword.required' | translate }}
            }
          </small>
        }
      </label>

      <button
        type="submit"
        class="cambiar__submit"
        [disabled]="loading || cambiarPasswordForm.invalid || isPasswordMismatch"
      >
        {{ loading ? ('common.loading' | translate) : ('auth.cambiarPassword.submitButton' | translate) }}
      </button>

      <div class="cambiar__secure">
        <i class="ti ti-lock" aria-hidden="true"></i>
        <span>{{ 'auth.cambiarPassword.security' | translate }}</span>
      </div>
    </form>
  </div>
</div>
