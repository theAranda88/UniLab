<div class="project-carousel" (click)="$event.stopPropagation()">
  @if (visibles().length === 0) {
    <div class="project-carousel__fallback" aria-hidden="true">
      <i class="ti ti-photo-off"></i>
    </div>
  } @else {
    <div
      class="project-carousel__track"
      [class.project-carousel__track--zoom]="zoomable"
      [style.--active-index]="activeIndex()"
      (click)="abrirVisor($event)"
    >
      @for (src of visibles(); track src; let i = $index) {
        <img
          class="project-carousel__slide"
          [class.project-carousel__slide--active]="activeIndex() === i"
          [src]="src"
          [alt]="activeIndex() === i ? alt : ''"
          loading="lazy"
          (error)="marcarRota(src)"
        />
      }
    </div>

    @if (zoomable) {
      <button
        type="button"
        class="project-carousel__expand"
        (click)="abrirVisor($event)"
        [attr.aria-label]="'common.zoom.open' | translate"
        [attr.title]="'common.zoom.open' | translate"
      >
        <i class="ti ti-arrows-maximize" aria-hidden="true"></i>
      </button>
    }

    @if (hasMultiple()) {
      <button
        type="button"
        class="project-carousel__nav project-carousel__nav--prev"
        (click)="prev($event)"
        [attr.aria-label]="'home.carousel.prev' | translate"
      >
        ‹
      </button>
      <button
        type="button"
        class="project-carousel__nav project-carousel__nav--next"
        (click)="next($event)"
        [attr.aria-label]="'home.carousel.next' | translate"
      >
        ›
      </button>
      <div class="project-carousel__dots">
        @for (src of visibles(); track src; let i = $index) {
          <button
            type="button"
            class="project-carousel__dot"
            [class.project-carousel__dot--active]="activeIndex() === i"
            [attr.aria-current]="activeIndex() === i ? 'true' : null"
            (click)="goTo(i, $event)"
            [attr.aria-label]="'home.carousel.goTo' | translate: { n: i + 1 }"
          ></button>
        }
      </div>
    }
  }
</div>

@if (visorAbierto()) {
  <app-image-lightbox [images]="visibles()" [alt]="alt" [startIndex]="activeIndex()" (closed)="cerrarVisor()" />
}
