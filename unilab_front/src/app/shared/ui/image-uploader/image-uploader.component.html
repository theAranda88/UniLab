<div class="uploader">
  <div class="uploader__grid">
    @for (img of guardadas(); track img.id) {
      <figure class="uploader__item">
        <img [src]="img.url" [alt]="alt()" loading="lazy" />
        <button
          type="button"
          class="uploader__remove"
          [disabled]="disabled()"
          (click)="eliminar.emit(img)"
          [attr.aria-label]="'imagenUploader.eliminar' | translate"
          [attr.title]="'imagenUploader.eliminar' | translate"
        >
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </figure>
    }

    @for (p of previews(); track p.url) {
      <figure class="uploader__item uploader__item--pendiente">
        <img [src]="p.url" [alt]="p.file.name" />
        <span class="uploader__badge">{{ 'imagenUploader.pendiente' | translate }}</span>
        <button
          type="button"
          class="uploader__remove"
          [disabled]="disabled()"
          (click)="quitarPendiente(p.file)"
          [attr.aria-label]="'imagenUploader.quitar' | translate"
          [attr.title]="'imagenUploader.quitar' | translate"
        >
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </figure>
    }

    @if (restantes() > 0) {
      <label class="uploader__add">
        <input
          type="file"
          accept="image/jpeg,image/png,image/webp"
          multiple
          [disabled]="disabled()"
          (change)="onSeleccionar($event)"
        />
        <i class="ti ti-photo-plus" aria-hidden="true"></i>
        <span>{{ 'imagenUploader.agregar' | translate }}</span>
      </label>
    }
  </div>

  <p class="uploader__hint">{{ 'imagenUploader.hint' | translate: { max: max() } }}</p>
</div>
