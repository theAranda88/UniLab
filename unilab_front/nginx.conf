server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # index.html nunca se guarda en caché: así el navegador siempre recibe los nombres
    # (con hash) de los archivos de la versión desplegada y no se queda con una versión vieja.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Traducciones e imágenes no llevan hash en el nombre: se revalidan en cada visita.
    location /assets/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # JS y CSS generados por Angular llevan hash: pueden guardarse un año.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
